# Checks on every pull request and push; on main, the site publishes to
# GitHub Pages only after they pass (a broken build never reaches players).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the stamp check compares against the base branch

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check cache stamps
        if: github.event_name == 'pull_request'
        run: node scripts/check-stamps.mjs origin/${{ github.base_ref }}

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check self-hosted assets (CSP hashes, vendored three.js, font subset)
        run: node scripts/check-assets.mjs

      - name: Smoke test (the game loads and flies)
        run: node scripts/smoke-test.mjs

      - name: Multiplayer server tests
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test

      # The image Cloud Run deploys: it must build from the lockfile and answer
      # its health check (memory store, dev mode, no Google credentials).
      - name: Server image builds and starts
        run: |
          docker build -t skywyrm-server .
          docker run -d --name skywyrm-server -p 8080:8080 skywyrm-server
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then echo; docker rm -f skywyrm-server; exit 0; fi
            sleep 1
          done
          docker logs skywyrm-server
          exit 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-shots
          path: smoke-shots/
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # job permissions replace the workflow's, so checkout needs this again
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
